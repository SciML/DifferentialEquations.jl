name: "Runic Suggestions"
on: pull_request
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  runic-suggestions:
    uses: "SciML/.github/.github/workflows/runic-suggestions-on-pr.yml@v1"
    secrets: "inherit"
